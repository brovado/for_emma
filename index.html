<!DOCTYPE html><html><head><meta charset='UTF-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Emma's Magic Reveal</title><style>body{margin:0;overflow:hidden;background:#ffdaf5;font-family:Arial,sans-serif;cursor:none}#game{position:relative;width:100vw;height:100vh}#bg{position:absolute;inset:0;background-size:cover;background-position:center}canvas{position:absolute;inset:0}#glass{position:absolute;font-size:72px;pointer-events:none;transform:translate(-50%,-50%)}#msg{position:absolute;top:15px;width:100%;text-align:center;font-size:2rem;color:white;text-shadow:0 2px 6px black;font-weight:bold}</style></head><body><div id='game'><div id='bg'></div><canvas id='fog'></canvas><canvas id='fx'></canvas><div id='glass'>🔍</div><div id='msg'>Find the hidden picture!</div></div><script>const pics=['https://picsum.photos/seed/unicorn/1400/900','https://picsum.photos/seed/princess/1400/900','https://picsum.photos/seed/fairy/1400/900'];let idx=0,score=0,done=false;const bg=document.getElementById('bg'),fog=document.getElementById('fog'),fx=document.getElementById('fx'),ctx=fog.getContext('2d'),fctx=fx.getContext('2d');function resize(){fog.width=fx.width=innerWidth;fog.height=fx.height=innerHeight;cover()}function cover(){ctx.globalCompositeOperation='source-over';ctx.fillStyle='black';ctx.fillRect(0,0,fog.width,fog.height)}function load(){bg.style.backgroundImage=`url(${pics[idx]})`;cover();score=0;done=false}resize();load();addEventListener('resize',resize);function reveal(x,y){if(done)return;ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(x,y,90,0,Math.PI*2);ctx.fill();score++;if(score>450){celebrate()}}function celebrate(){done=true;document.getElementById('msg').textContent='🎉 Great Job Emma! 🎉';let t=0;const iv=setInterval(()=>{t++;for(let i=0;i<20;i++){fctx.beginPath();fctx.arc(Math.random()*fx.width,Math.random()*fx.height,Math.random()*6+2,0,Math.PI*2);fctx.fillStyle=`hsl(${Math.random()*360},100%,60%)`;fctx.fill()}if(t>20){clearInterval(iv);fctx.clearRect(0,0,fx.width,fx.height);idx=(idx+1)%pics.length;load();document.getElementById('msg').textContent='Find the hidden picture!'}},100)}document.addEventListener('mousemove',e=>{glass.style.left=e.clientX+'px';glass.style.top=e.clientY+'px';reveal(e.clientX,e.clientY)});document.addEventListener('touchmove',e=>{const t=e.touches[0];glass.style.left=t.clientX+'px';glass.style.top=t.clientY+'px';reveal(t.clientX,t.clientY)},{passive:true});</script></body></html>
